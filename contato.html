<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contato - ASAS – Instalações Elétricas e Hidrossanitárias</title>
<link rel="icon" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#062a4d;--blue:#0b5cab;--sky:#008be2;--gold:#f2a71b;--bg:#f3f7fb;--line:#d9e5f1;--tx:#1d2b3a;--mut:#56677a}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font:400 1rem/1.7 Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx)}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
ul{list-style:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.c{width:min(1140px,92%);margin:auto}
h1,h2,h3{color:var(--navy);line-height:1.2}
h2{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800;margin-bottom:.7rem}
h3{font-size:1.1rem;margin-bottom:.4rem}
.sec{padding:84px 0}.alt{background:var(--bg)}.m{margin:32px 0}
.lead{color:var(--mut);max-width:64ch}
.btn{display:inline-block;margin:4px 8px 4px 0;padding:14px 26px;border:2px solid var(--gold);border-radius:6px;background:var(--gold);color:var(--navy);font:700 .95rem Montserrat,sans-serif;cursor:pointer;transition:background .2s,color .2s}
.btn:hover{background:#fff}
.btn.o{background:none;border-color:#fff;color:#fff}.btn.o:hover{background:#fff;color:var(--navy)}
.btn.dk{background:none;border-color:var(--navy);color:var(--navy)}.btn.dk:hover{background:var(--navy);color:#fff}
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
header.sc{box-shadow:0 4px 18px rgba(6,42,77,.12)}
.nav{display:flex;align-items:center;justify-content:space-between;height:78px}
.nav img{height:54px}
nav ul{display:flex;gap:4px}
nav a{display:block;padding:10px 16px;border-radius:6px;font-weight:600;font-size:.92rem;color:var(--navy)}
nav a:hover,nav a.on{color:var(--sky);background:var(--bg)}
nav a.cta{background:var(--blue);color:#fff}nav a.cta:hover{background:var(--navy);color:#fff}
.mb{display:none;background:none;border:0;font-size:2rem;line-height:1;color:var(--navy);cursor:pointer}
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,#041d38,#0b4f8a)}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.16) 1.5px,transparent 1.5px) 0 0/22px 22px;-webkit-mask-image:linear-gradient(90deg,transparent 30%,#000);mask-image:linear-gradient(90deg,transparent 30%,#000)}
.hero .c{position:relative;padding:112px 0 104px}
.hero h1{color:#fff;font-size:clamp(2rem,5vw,3.4rem);font-weight:800;max-width:15em}
.hero h1 span{color:var(--gold)}
.hero .lead{color:#d6e4f3;margin:22px 0 32px;font-size:1.1rem}
.ph .c{padding:64px 0 56px}.ph .lead{margin-bottom:0}
.ct{margin-bottom:22px}.ct b{display:block;color:var(--navy)}.ct a:hover{color:var(--sky)}
form{display:grid;gap:14px}
label{display:block;font-weight:600;font-size:.9rem;color:var(--navy)}
input,textarea,select{width:100%;margin-top:4px;padding:13px 14px;border:1.5px solid #c9d8e8;border-radius:4px;font:inherit;background:#fff}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--sky);box-shadow:0 0 0 3px rgba(0,139,226,.18)}
footer{background:#041d38;color:#b9c9da;padding:60px 0 0;font-size:.92rem}
.fg{display:grid;grid-template-columns:1.3fr 1fr 1.3fr;gap:40px}
footer h4{color:#fff;margin-bottom:12px}footer li{margin-bottom:8px}footer a:hover{color:var(--gold)}
.fl{width:120px;padding:10px;background:#fff;border-radius:4px;margin-bottom:14px}
.cp{margin-top:44px;padding:20px 0;border-top:1px solid rgba(255,255,255,.12);text-align:center;font-size:.85rem}
.wa{position:fixed;right:20px;bottom:20px;z-index:60;padding:12px 20px;border-radius:30px;background:#0f8a45;color:#fff;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.3)}
@media(max-width:820px){
.mb{display:block}
nav{position:absolute;top:78px;left:0;right:0;max-height:0;overflow:hidden;background:#fff;transition:max-height .3s}
nav.open{max-height:420px;border-bottom:1px solid var(--line)}
nav ul{flex-direction:column;padding:12px 4%}
.fg{grid-template-columns:1fr}
.sec{padding:56px 0}.hero .c{padding:72px 0}}
</style>
</head>
<body>

<section class="hero ph">
  <div class="c">
    <h1>Fale com a <span>ASAS</span></h1>
    <p class="lead">Solicite um orçamento ou tire suas dúvidas com nossa equipe.</p>
  </div>
</section>

<section class="sec alt">
  <div class="c ct" style="max-width: 600px; margin: 0 auto;">
    <form id="f">
      <label>Falar com:
        <select name="destinatario" id="dest">
          <option value="asdrubal">Asdrubal Filho</option>
          <option value="augusto">Augusto Santa Roza</option>
        </select>
      </label>
      <label>Nome: <input type="text" name="nome" required></label>
      <label>Telefone: <input type="tel" name="tel" required></label>
      <label>E-mail: <input type="email" name="email" required></label>
      <label>Mensagem: <textarea name="msg" rows="5" required></textarea></label>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button type="submit" class="btn">Enviar por E-mail</button>
        <button type="button" id="wz" class="btn" style="background:#0f8a45; color:#fff; border-color:#0f8a45;">Enviar por WhatsApp</button>
      </div>
    </form>
  </div>
</section>

<script>
const PAGES=[['index.html','Home'],['quem-somos.html','Quem somos'],['servicos.html','Serviços'],['portfolio.html','Portfólio'],['contato.html','Contato']];
const T1='21 96410-2652',T2='21 98291-3851',ZAP='5521982913851',MAIL='asdrubalf@asasnit.com.br';
const tel=t=>'tel:+55'+t.replace(/\D/g,'');
const cur=(location.pathname.split('/').pop()||'index').replace('.html','');

document.body.insertAdjacentHTML('afterbegin',`<header><div class="c nav"><a href="index.html"><img src="assets/logo.png" alt="ASAS"></a><button class="mb" aria-label="Abrir menu" aria-expanded="false">☰</button><nav><ul>${PAGES.map(([h,t])=>`<li><a href="${h}" class="${h.replace('.html','')===cur?'on':''}${h=='contato.html'?' cta':''}">${t}</a></li>`).join('')}</ul></nav></div></header>`);
document.body.insertAdjacentHTML('beforeend',`<footer><div class="c fg"><div><div class="fl"><img src="assets/logo.png" alt="ASAS"></div><p>Asas da Elétrica Hidráulica Ltda.<br>Instalações elétricas e hidrossanitárias em todo o Brasil desde 1997.</p></div><div><h4>Navegação</h4><ul>${PAGES.map(([h,t])=>`<li><a href="${h}">${t}</a></li>`).join('')}</ul></div><div><h4>Contato</h4><ul><li><a href="${tel(T1)}">${T1}</a> (Asdrubal Filho)</li><li><a href="${tel(T2)}">${T2}</a> (Augusto Santa Roza)</li><li><a href="mailto:${MAIL}">${MAIL}</a></li><li>Trav. Lengruber Filho, 770 – Engenhoca<br>Niterói/RJ – CEP 24.110-498</li></ul></div></div><div class="c cp">© ${new Date().getFullYear()} Asas da Elétrica Hidráulica Ltda. Todos os direitos reservados.</div></footer><a class="wa" href="https://wa.me/${ZAP}" target="_blank" rel="noopener">WhatsApp</a>`);

const hd=document.querySelector('header'),mb=hd.querySelector('.mb'),nv=hd.querySelector('nav');
mb.onclick=()=>mb.setAttribute('aria-expanded',nv.classList.toggle('open'));
nv.onclick=e=>{if(e.target.tagName=='A')nv.classList.remove('open')};
addEventListener('scroll',()=>hd.classList.toggle('sc',scrollY>10));

const f=document.getElementById('f');
if(f){
  const txt=()=>{const d=new FormData(f);return `Olá! Sou ${d.get('nome')} (${d.get('tel')}, ${d.get('email')}).\n\n${d.get('msg')}`};
  
  const obterDestino = () => {
    const dest = document.getElementById('dest').value;
    if(dest === 'augusto') {
      return { zap: '5521982913851', mail: 'augusto@asasnit.com.br' };
    }
    return { zap: '5521964102652', mail: 'asdrubalf@asasnit.com.br' };
  };

  f.onsubmit=e=>{
    e.preventDefault();
    const destino = obterDestino();
    const assunto = encodeURIComponent('Contato pelo site');
    const corpo = encodeURIComponent(txt());
    window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${destino.mail}&su=${assunto}&body=${corpo}`, '_blank');
  };
  
  document.getElementById('wz').onclick=()=>{
    if(f.reportValidity()){
      const destino = obterDestino();
      open(`https://wa.me/${destino.zap}?text=${encodeURIComponent(txt())}`);
    }
  };
}
</script>
</body>
</html>
